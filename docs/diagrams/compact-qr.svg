<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="773" viewBox="0 0 1500 773"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#306284"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="120.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">Student</text><line x1="120" y1="80" x2="120" y2="698" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><rect x="430" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="540.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">Instructor</text><line x1="540" y1="80" x2="540" y2="698" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><rect x="850" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="960.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">API / rules</text><line x1="960" y1="80" x2="960" y2="698" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><rect x="1270" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="1380.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">SQLite</text><line x1="1380" y1="80" x2="1380" y2="698" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><line x1="120" y1="140" x2="540" y2="140" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="330.0" y="128" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Show signed QR (120s; refresh every 30s)</text><line x1="540" y1="214" x2="960" y2="214" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="750.0" y="202" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">POST /class-qr-check-ins {classId, token}</text><line x1="960" y1="288" x2="1045" y2="288" stroke="#306284" stroke-width="2.5"/><line x1="1045" y1="288" x2="1045" y2="315" stroke="#306284" stroke-width="2.5"/><line x1="1045" y1="315" x2="960" y2="315" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="948" y="278" text-anchor="end" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Verify assigned instructor, time and signature</text><line x1="960" y1="362" x2="1380" y2="362" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="1170.0" y="350" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">BEGIN IMMEDIATE; read subscription + booking</text><line x1="1380" y1="436" x2="960" y2="436" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="1170.0" y="424" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Require active suitable plan AND confirmed booking</text><line x1="960" y1="510" x2="1380" y2="510" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="1170.0" y="498" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Set checked_in; notify and audit; COMMIT</text><line x1="960" y1="584" x2="540" y2="584" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="750.0" y="572" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Success, or already checked in on repeat</text><rect x="8" y="708" width="1484" height="58" rx="8" fill="#f4f6f8" stroke="#c5cfd6" stroke-width="2"/><text x="750.0" y="744" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#183348">Invalid/expired QR, wrong instructor, missing plan or missing booking: error; no attendance write.</text></svg>