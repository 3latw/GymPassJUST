<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="921" viewBox="0 0 1500 921"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#306284"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="120.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">Student</text><line x1="120" y1="80" x2="120" y2="846" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><rect x="430" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="540.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">API / rules</text><line x1="540" y1="80" x2="540" y2="846" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><rect x="850" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="960.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">SQLite</text><line x1="960" y1="80" x2="960" y2="846" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><rect x="1270" y="10" width="220" height="70" rx="8" fill="#edf4fa" stroke="#306284" stroke-width="2"/><text x="1380.0" y="53.64" text-anchor="middle" font-family="Arial" font-size="27" font-weight="400" fill="#183348">Next waiter</text><line x1="1380" y1="80" x2="1380" y2="846" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7"/><line x1="120" y1="140" x2="540" y2="140" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="330.0" y="128" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Cancel own booking</text><line x1="540" y1="214" x2="625" y2="214" stroke="#306284" stroke-width="2.5"/><line x1="625" y1="214" x2="625" y2="241" stroke="#306284" stroke-width="2.5"/><line x1="625" y1="241" x2="540" y2="241" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="528" y="204" text-anchor="end" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Check at least 2h before class starts</text><line x1="540" y1="288" x2="960" y2="288" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="750.0" y="276" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">BEGIN IMMEDIATE; cancel booking</text><line x1="540" y1="362" x2="960" y2="362" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="750.0" y="350" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Select waiting students in created/id order</text><line x1="960" y1="436" x2="540" y2="436" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="750.0" y="424" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">First candidate with valid plan and no overlap</text><line x1="540" y1="510" x2="960" y2="510" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="750.0" y="498" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Confirm candidate; notify; audit; COMMIT</text><line x1="540" y1="584" x2="120" y2="584" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="330.0" y="572" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Return cancelled</text><line x1="1380" y1="658" x2="540" y2="658" stroke="#306284" stroke-width="2.5" marker-end="url(#a)"/><text x="960.0" y="646" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Later: GET /api/notifications</text><line x1="540" y1="732" x2="1380" y2="732" stroke="#306284" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="960.0" y="720" text-anchor="middle" font-family="Arial" font-size="25" font-weight="400" fill="#183348">Return promotion message</text><rect x="8" y="856" width="1484" height="58" rx="8" fill="#f4f6f8" stroke="#c5cfd6" stroke-width="2"/><text x="750.0" y="892" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#183348">One transaction keeps cancellation, the free seat and promotion consistent.</text></svg>